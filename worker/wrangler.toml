name = "rummanandesther-rsvp"
main = "src/index.js"
compatibility_date = "2026-05-23"

[[d1_databases]]
binding = "DB"
database_name = "rummanandesther-rsvp"
database_id = "4eb3f2c5-8659-4c74-8958-6000734bed01"

[vars]
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,https://rummanandesther.com,https://main--rummanandesther.netlify.app"
INVITE_BASE_URL = "https://rummanandesther.com"
UPLOAD_CLOSES = "2027-01-02T23:59:59Z"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "wedding-media"

[[ratelimits]]
name = "UPLOAD_LIMITER"
namespace_id = "3601"
simple = { limit = 300, period = 60 }

# Per-IP backstop (the venue shares one NAT IP, so this is deliberately generous).
[[ratelimits]]
name = "UPLOAD_IP_LIMITER"
namespace_id = "3602"
simple = { limit = 3000, period = 60 }

# Guest gallery views, keyed by device id, separate from the upload budget.
[[ratelimits]]
name = "GALLERY_LIMITER"
namespace_id = "3603"
simple = { limit = 120, period = 60 }

[triggers]
crons = ["17 3 * * *"]
